name: Refresh Listings

on:
  schedule:
    # Every day at 10:00 UTC (4:00 AM MST). Batch size comes from the free Google allowance.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24 runs the shared TypeScript hours check in src/lib/openNow.ts directly.
          node-version: 24

      - name: Refresh batch
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: npm run refresh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/businesses/ scripts/places-usage.json scripts/refresh-priority.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh business listings ($(date +%Y-%m-%d))"
            git push
          fi
